<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#8B5CF6" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#06B6D4" opacity="0.1"/>
  
  <!-- Name -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#text)" text-anchor="middle">Ryan Guimarães</text>
  
  <!-- Title -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="36" fill="#ededed" text-anchor="middle">Full-Stack Developer</text>
  
  <!-- Divider -->
  <line x1="300" y1="370" x2="900" y2="370" stroke="url(#text)" stroke-width="2"/>
  
  <!-- Technologies -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="24" fill="#a1a1aa" text-anchor="middle">Python • JavaScript • TypeScript • PHP • Java • React • Next.js • Docker</text>
  
  <!-- CTA -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="20" fill="#06B6D4" text-anchor="middle">ryanguimaraes.dev</text>
  
  <!-- Social Links -->
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="16" fill="#71717a" text-anchor="middle">github.com/guimaraesr-y • linkedin.com/in/guimaraesry</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#8B5CF6" opacity="0.3"/>
</svg>